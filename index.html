    <!-- Apply saved / system theme before first paint to avoid a flash. -->
    <script>
      (function () {
        var pref = "system";
        try { pref = localStorage.getItem("theme") || "system"; } catch (e) {}
        var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>

    <!-- Single Page Apps for GitHub Pages (https://github.com/rafgraph/spa-github-pages).
         Restores the deep link that public/404.html encoded into the query string. -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) { return s.replace(/~and~/g, "&"); })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
